<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Report Editor — Tacrolimus Kidney Trial 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<!-- Tailwind (Play CDN) for the native select menus. Preflight is off so it doesn't reset the editor's own styles. -->
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>tailwind.config={corePlugins:{preflight:false},theme:{extend:{fontFamily:{sans:["Manrope","system-ui","sans-serif"]}}}}</script>
<style>
  /*
    Accessibility rules for this page:
    - Every text size is 14px or larger, at the default 100% zoom.
    - Every text color meets WCAG AA (4.5:1) against its background.
    The app's original light grays (#C1BFD4, #A7A5C0) are kept only for borders and dividers.
  */
  :root {
    /* Text (all ≥ 4.5:1 on white and on --surface) */
    --text: #1d1a37;          /* 15.9:1 */
    --text-muted: #575472;    /* 7.2:1 */
    --text-subtle: #66637f;   /* 5.7:1 */
    --primary-text: #4f46e5;  /* 6.3:1 */
    /* Surfaces + lines (non-text) */
    --surface: #fafaff; --surface-2: #f0f0f9; --line: #e6e5f1; --line-strong: #d8d6e6; --white:#fff;
    --icon: #77748f;          /* 4.6:1, icons and controls */
    --primary: #4f46e5; --primary-soft: #eeedfd; --danger: #c81e1e;
    /* Data viz (from the 🧩 Reporting components library) */
    --control:#1f2937; --treatment:#1d4ed8; --highlight:#7c3aed; --individual:#94a3b8;
    --band:#dcebfb; --band-text:#1e40af; --period:#eef0f3; --event:#a1460a;
    --good-bg:#dcfce7; --good-fg:#166534; --bad-bg:#fee2e2; --bad-fg:#b91c1c;
    --warn-bg:#fef3c7; --warn-fg:#854d0e; --neutral-bg:#f1f2f4; --neutral-fg:#374151;
    --sev0:#f1f2f4; --sev1:#dbeafe; --sev2:#93c5fd; --sev3:#2563eb; --sev4:#1d4ed8; --sev5:#1e3a8a;
    --shadow-sm:0 1px 2px rgba(51,51,51,.06),0 1px 3px rgba(51,51,51,.08);
    --shadow-field:0 6px 10px -6px rgba(51,51,51,.1);
    --shadow-section:0 12px 28px -8px rgba(51,51,51,.12);
    --header-h:64px; --aside-w:335px; --zoom:1;
  }
  body.blinded { --control:#374151; --treatment:#6b7280; }

  *{box-sizing:border-box}
  /* Tailwind's preflight is off, so make sure the hidden attribute always wins over utility classes like .flex */
  [hidden]{display:none !important}
  html,body{height:100%}
  body{margin:0;font-family:"Manrope",system-ui,sans-serif;font-size:15px;line-height:1.5;color:var(--text);background:var(--surface-2);overflow:hidden}
  button,input,select,textarea{font:inherit;color:inherit}
  button{background:none;border:0;padding:0;cursor:pointer}
  :focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}
  svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- Top bar ---------- */
  .topbar{position:fixed;inset:0 0 auto 0;height:var(--header-h);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;background:var(--white);box-shadow:0 1px 0 var(--line)}
  .topbar-left,.topbar-right{display:flex;align-items:center;min-width:0}
  .topbar-right{gap:12px}
  .back{display:flex;align-items:center;gap:8px;color:var(--text-muted);font-weight:600;text-decoration:none;font-size:14px}
  .back:hover{color:var(--text)}
  .seg{display:flex;padding:3px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
  .seg button{height:30px;padding:0 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--text-subtle);white-space:nowrap}
  .seg button:hover{color:var(--text)}
  .seg button[aria-checked="true"]{background:var(--white);color:var(--text);box-shadow:var(--shadow-sm)}
  .mode-wrap{padding-left:20px}
  .divider{width:1px;height:24px;background:var(--line);margin:0 16px}
  .title-input{border:0;outline:0;background:transparent;font-size:15px;font-weight:700;width:220px;padding:4px 0}
  .view-label{font-size:14px;font-weight:600;color:var(--text-subtle)}
  .saved{padding:4px 10px;border-radius:9999px;background:var(--surface-2);color:var(--text-muted);font-weight:600;font-size:14px}
  .ghost{display:flex;align-items:center;gap:6px;color:var(--text-muted);font-weight:600;font-size:14px}
  .ghost svg.i{width:18px;height:18px}
  .ghost:hover{color:var(--text)}
  .btn-primary{display:flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;background:var(--primary);color:#fff;font-weight:700;font-size:14px}
  .btn-primary:hover{background:#4338ca}
  .btn-primary svg.i{width:18px;height:18px}

  /* ---------- Layout ---------- */
  .workspace{position:absolute;top:var(--header-h);left:0;right:0;bottom:0;display:flex}
  .canvas{flex:1;overflow:auto;position:relative;padding:28px 32px 120px}
  .page{width:100%;max-width:1240px;min-width:960px;zoom:var(--zoom);display:flex;flex-direction:column;gap:28px}

  /* ---------- Section ---------- */
  .section{position:relative;background:var(--white);border:1px solid var(--line-strong);border-radius:8px;padding:24px;box-shadow:var(--shadow-section)}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .section-head-left{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
  .section-title{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.4}
  .section-actions{display:flex;gap:4px;opacity:0;transition:opacity .15s}
  .section:hover .section-actions,.section:focus-within .section-actions{opacity:1}
  .icon-btn{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;color:var(--icon)}
  .icon-btn:hover{background:var(--surface-2);color:var(--text)}
  .icon-btn.danger:hover{color:var(--danger)}
  .eyebrow{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--primary-text);margin:0 0 2px 40px}
  .section-summary{margin:0 0 20px 40px;max-width:820px;font-size:15px;color:var(--text-muted)}
  .section-summary b{color:var(--text)}
  .section-body{display:flex;flex-direction:column;gap:20px}
  .row{display:flex;gap:20px;align-items:flex-start}

  /* ---------- Block ---------- */
  .block{border:1px solid var(--line);border-radius:12px;background:var(--white);overflow:hidden;min-width:0}
  .block-head{display:flex;align-items:center;gap:8px;min-height:40px;padding:4px 10px 4px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
  .grip{color:var(--icon);cursor:grab;display:flex}
  .grip svg.i{width:18px;height:18px}
  .block-kind{font-size:14px;font-weight:700;color:var(--text-subtle)}
  .block-tools{margin-left:auto;display:flex;gap:2px;align-items:center}
  .block-tools button{color:var(--icon);display:grid;place-items:center;width:30px;height:30px;border-radius:6px}
  .block-tools button svg.i{width:18px;height:18px}
  .block-tools button:hover{background:var(--surface-2);color:var(--text)}
  .block-tools button.danger{color:var(--danger)}
  .block-body{padding:18px 20px}
  .card-title{font-size:18px;font-weight:800;letter-spacing:-.01em;margin:0}
  .card-sub{font-size:14px;color:var(--text-muted);margin:2px 0 0}

  /* Card actions */
  .actions{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
  .act{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;font-size:14px;font-weight:600;color:var(--text-muted);background:#fff;white-space:nowrap}
  .act svg.i{width:16px;height:16px}
  .act:hover,.act[aria-pressed="true"]{border-color:var(--primary);color:var(--primary-text);background:var(--primary-soft)}

  /* Status + change badges */
  .tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap;line-height:1.5}
  .tag.good{background:var(--good-bg);color:var(--good-fg)} .tag.bad{background:var(--bad-bg);color:var(--bad-fg)}
  .tag.warn{background:var(--warn-bg);color:var(--warn-fg)} .tag.neutral{background:var(--neutral-bg);color:var(--neutral-fg)}
  .change{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--text-muted);flex-wrap:wrap}
  .change .chip{padding:1px 7px;border-radius:6px;font-weight:700}
  .change.bad .chip{background:var(--bad-bg);color:var(--bad-fg)} .change.bad b{color:var(--bad-fg)}
  .change.good .chip{background:var(--good-bg);color:var(--good-fg)} .change.good b{color:var(--good-fg)}
  .change.neutral .chip{background:var(--neutral-bg);color:var(--neutral-fg)} .change.neutral b{color:var(--neutral-fg)}

  /* Data note */
  .note{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border-radius:8px;font-size:14px}
  .note.info{background:#eff6ff;color:#1e3a8a} .note.warn{background:var(--warn-bg);color:var(--warn-fg)}
  .note svg.i{width:16px;height:16px;margin-top:2px}

  /* Finding callout */
  .callout{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .callout .accent{width:6px;background:var(--event);flex:none}
  .callout .body{padding:18px 22px;flex:1}
  .callout .kicker{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800;letter-spacing:.04em;color:var(--event)}
  .callout .kicker svg.i{width:16px;height:16px}
  .callout h3{font-size:20px;margin:6px 0 4px;letter-spacing:-.01em;line-height:1.35}
  .callout p{font-size:15px;color:var(--text-muted);margin:0 0 12px}
  .evidence{display:flex;gap:10px;flex-wrap:wrap}
  .ev{padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
  .ev small{display:block;font-size:14px;font-weight:600;color:var(--text-subtle)}
  .ev b{font-size:16px}
  .link{color:var(--primary-text);font-weight:700;font-size:14px;margin-top:10px;display:inline-block;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

  /* Metric cards */
  .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .metric{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;display:flex;flex-direction:column;gap:7px}
  .metric .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;flex-wrap:wrap}
  .metric .kind{font-size:14px;font-weight:600;color:var(--text-subtle)}
  .metric .name{font-size:16px;font-weight:800}
  .metric .value{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .metric .value small{font-size:14px;font-weight:600;color:var(--text-muted);margin-left:4px}
  .metric .hint{font-size:14px;color:var(--text-muted)}
  .metric .foot{border-top:1px solid var(--line);padding-top:8px;font-size:14px;color:var(--text-muted)}
  .metric .foot b{color:var(--band-text);font-weight:600}


  /* Donor fields */
  .donor-groups{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
  .dgroup{grid-column:span var(--span);display:grid;grid-template-columns:subgrid;grid-template-rows:auto 1fr;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
  .dgroup header{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
  .dgroup header svg.i{width:18px;height:18px;color:var(--text-muted)}
  .dgroup h4{margin:0;font-size:16px;font-weight:800}
  .dgroup dl{grid-column:1/-1;margin:0;display:grid;grid-template-columns:subgrid}
  .drow{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px 14px}
  .drow+.drow::before{content:"";position:absolute;left:-7px;top:0;bottom:0;width:1px;background:var(--line)}
  .drow dt{font-size:14px;font-weight:600;color:var(--text-muted)}
  .drow dd{margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  .drow dd strong{font-size:16px;font-weight:800}
  .drow.out dd strong{color:#991b1b}
  .drow.missing dd strong{color:var(--warn-fg)}
  .field{border-radius:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
  .field.out{background:#fef2f2;border-color:#fca5a5}
  .field.missing{background:#fffbeb;border:1px dashed #d97706}
  .field label{font-size:14px;font-weight:600;color:var(--text-muted)}
  .field .v{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .field .v strong{font-size:20px;font-weight:800}
  .field.missing strong{color:var(--warn-fg)}
  .field small{font-size:14px;color:var(--text-subtle)}
  .field.out small{color:#7f1d1d}
  .field .tag{align-self:flex-start}
  .field .link{margin:0}

  /* Study details */
  .study-card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:22px 24px}
  .study-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .study-head h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
  .badge-proto svg.i{width:15px;height:15px}
  .details{display:grid;grid-template-columns:160px 1fr;gap:16px;font-size:15px;margin:0;align-items:center}
  .btn-outline{height:34px;padding:0 14px;border:1.5px solid var(--primary);border-radius:999px;color:var(--primary-text);font-size:15px;font-weight:600;background:#fff}
  .btn-outline:hover{background:var(--primary-soft)}
  .details dt{color:var(--text-muted);font-weight:600}
  .details dd{margin:0}
  .badge-proto{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary-text);font-size:14px;font-weight:700}

  /* Charts */
  .chart-card{flex:1;min-width:0}
  .chart-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:8px;flex-wrap:wrap}
  .legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:4px 0 8px;font-size:14px;font-weight:600}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .sw-line{width:22px;height:3px;border-radius:2px;position:relative;display:inline-block}
  .sw-line::after{content:"";position:absolute;left:7px;top:-3px;width:9px;height:9px;border-radius:50%;background:inherit}
  .sw-box{width:18px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.08)}
  .sw-event{width:3px;height:16px;background:var(--event);display:inline-block}
  .sw-dot{width:10px;height:10px;border-radius:50%;background:var(--individual);display:inline-block}
  .sw-dash{width:22px;border-top:3px dashed var(--highlight);display:inline-block}
  svg.chart{display:block;max-width:100%;height:auto}
  svg.chart text{font-family:Manrope}

  /* ---------- Kidney function grid ---------- */
  .kf-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
  .kf-grid .block-body{padding:14px 14px 12px}
  .mini-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
  .mini-head .card-title{font-size:16px}
  .actions.mini{gap:4px;flex-wrap:nowrap}
  .act.icon-only{width:32px;padding:0;justify-content:center}
  .mini-hint{margin-top:6px}


  /* ---------- Interactive charts ---------- */
  .cw{position:relative}
  svg.chart{outline:none;touch-action:pan-y}
  svg.chart:focus-visible{outline:3px solid var(--primary);outline-offset:4px;border-radius:6px}
  .crosshair{stroke:#4b4a5e;stroke-width:1.5;stroke-dasharray:4 4;opacity:0;transition:opacity .15s ease;pointer-events:none}
  svg.hovering .crosshair{opacity:1}
  .pt{transform-box:fill-box;transform-origin:center;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
  .pt.hot{transform:scale(1.6)}
  [data-tip]{cursor:help}
  .kd{transition:fill-opacity .15s}
  .kd:hover{fill-opacity:.8}
  [data-k]{transition:opacity .35s ease}
  .cw[data-off~="c"] [data-k="c"],.cw[data-off~="t"] [data-k="t"],.cw[data-off~="band"] [data-k="band"],
  .cw[data-off~="period"] [data-k="period"],.cw[data-off~="event"] [data-k="event"],.cw[data-off~="dev"] [data-k="dev"],
  .cw[data-off~="ind"] [data-k="ind"],.cw[data-off~="hl"] [data-k="hl"]{opacity:.06;pointer-events:none}
  .chart-tip{position:absolute;left:0;top:0;z-index:6;pointer-events:none;min-width:200px;max-width:300px;background:#fff;border:1px solid var(--line-strong);border-radius:10px;
    box-shadow:0 12px 28px -10px rgba(29,26,55,.3);padding:10px 12px;font-size:14px;color:var(--text);opacity:0;transform:translateY(6px) scale(.98);
    transition:opacity .16s ease,transform .16s ease,left .14s cubic-bezier(.2,.8,.2,1),top .14s cubic-bezier(.2,.8,.2,1)}
  .chart-tip.on{opacity:1;transform:none}
  .tip-h{font-weight:800;margin-bottom:4px}
  .tip-row{display:flex;align-items:center;gap:8px;line-height:1.7;white-space:nowrap}
  .tip-row i{width:10px;height:10px;border-radius:50%;flex:none}
  .tip-row b{margin-left:auto}
  .tip-row b small{font-size:14px;font-weight:600;color:var(--text-muted)}
  .tip-row .tag{padding:0 7px}
  .lg{display:inline-flex;align-items:center;gap:7px;padding:3px 9px;margin:0 -2px;border-radius:999px;border:1px solid transparent;font-size:14px;font-weight:600;color:var(--text);transition:background .2s,color .2s}
  .lg:hover{background:var(--surface-2);border-color:var(--line)}
  .lg i{transition:opacity .2s}
  .lg[aria-pressed="false"]{color:var(--text-subtle);text-decoration:line-through}
  .lg[aria-pressed="false"] i{opacity:.3}
  .heat td.cell{transition:box-shadow .15s ease,transform .15s ease}
  .heat td.cell.hl{box-shadow:inset 0 0 0 2px var(--primary)}
  .heat td.cell:hover{transform:scale(1.08)}

  /* ---------- Motion (skipped entirely when the user prefers reduced motion) ---------- */
  @media (prefers-reduced-motion: no-preference){
    .cw.await svg,.heat.await{opacity:0}
    .cw.anim .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.33,.66,.25,1) forwards}
    .cw.anim .pt{animation:pop .45s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:calc(.3s + var(--i,0) * 35ms)}
    .cw.anim .fade{animation:fadeIn .6s ease backwards;animation-delay:.1s}
    .cw.anim .lab{animation:fadeIn .5s ease backwards;animation-delay:.9s}
    .cw.soft>svg,.cw.soft>table{animation:fadeIn .25s ease}
    .heat.anim td.cell{animation:pop .4s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:calc(var(--i,0) * 12ms)}
    body:not(.booted) .block,body:not(.booted) .metric,body:not(.booted) .callout{animation:rise .45s cubic-bezier(.2,.8,.2,1) backwards}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{from{opacity:0;transform:scale(.4)}}
  @keyframes fadeIn{from{opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}}
  .data-table{width:100%;border-collapse:collapse;font-size:14px;margin-top:4px}
  .data-table th,.data-table td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right}
  .data-table th:first-child,.data-table td:first-child{text-align:left}
  .data-table th{background:var(--surface);color:var(--text-muted);font-weight:700}

  /* Side panels */
  .panel{width:240px;flex:none;border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;background:#fff}
  .panel h4{margin:0;font-size:16px}
  .panel .lbl{font-size:14px;font-weight:700;color:var(--text-muted)}
  .inrow{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-muted)}
  .inrow input,.panel select{width:64px;font-size:14px;padding:5px 8px;border:1px solid var(--line-strong);border-radius:6px;background:#fff}
  .panel select{width:100%}
  .panel .act{justify-content:center}
  .panel .hint{font-size:14px;color:var(--text-subtle)}
  .toggle{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;user-select:none}
  .toggle input{appearance:none;width:36px;height:20px;border-radius:10px;background:#8c89a6;position:relative;cursor:pointer;flex:none;margin:0;transition:background .15s}
  .toggle input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
  .toggle input:checked{background:var(--primary)}
  .toggle input:checked::after{left:18px}
  .chipset{display:flex;flex-wrap:wrap;gap:6px}

/* ================= SVG chart engine (interactive + animated) =================

function axisChart({W,H,ml=62,mr=132,mt=40,mb=56,x0,x1,y0,y1,xt,yt,xLabel,yLabel,label,draw,xfmt=v=>v}){
  const pw=W-ml-mr,ph=H-mt-mb,X=v=>ml+(v-x0)/(x1-x0)*pw,Y=v=>mt+(y1-v)/(y1-y0)*ph;
  PLOT={X,Y,ml,mt,pw,ph,W,H};
  let s=`<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" tabindex="0" aria-label="${label}. Use the left and right arrow keys to read values.">`;
  s+=draw.back?draw.back({X,Y,ml,mt,pw,ph}):"";
  yt.forEach(v=>s+=`<line x1="${ml}" x2="${ml+pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e8e9ef"/>`);
  s+=`<line x1="${ml}" x2="${ml}" y1="${mt}" y2="${mt+ph}" stroke="#1f2937" stroke-width="1.5"/><line x1="${ml}" x2="${ml+pw}" y1="${mt+ph}" y2="${mt+ph}" stroke="#1f2937" stroke-width="1.5"/>`;
  xt.forEach(v=>s+=`<line x1="${X(v)}" x2="${X(v)}" y1="${mt+ph}" y2="${mt+ph+5}" stroke="#1f2937" stroke-width="1.5"/><text x="${X(v)}" y="${mt+ph+22}" text-anchor="middle" font-size="${FS.tick}" fill="#4b4a5e">${xfmt(v)}</text>`);
  yt.forEach(v=>s+=`<line x1="${ml-5}" x2="${ml}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1f2937" stroke-width="1.5"/><text x="${ml-10}" y="${Y(v)+5}" text-anchor="end" font-size="${FS.tick}" fill="#4b4a5e">${String(v).replace("-","−")}</text>`);
  s+=`<text x="${ml+pw/2}" y="${H-8}" text-anchor="middle" font-size="${FS.axis}" font-weight="700" fill="#1d1a37">${xLabel}</text>`;
  s+=`<text transform="translate(16 ${mt+ph/2}) rotate(-90)" text-anchor="middle" font-size="${FS.axis}" font-weight="700" fill="#1d1a37">${yLabel}</text>`;
  s+=xhair(mt,mt+ph);
  s+=draw.front({X,Y,ml,mt,pw,ph});
  return s+"</svg>";
}

function niceTicks(a,b,n=6){const span=b-a;if(!(span>0))return [a];const raw=span/n,mag=10**Math.floor(Math.log10(raw));const step=[1,2,5,10].map(m=>m*mag).find(st=>span/st<=n)||mag*10;const out=[];for(let v=Math.ceil(a/step-1e-9)*step;v<=b+1e-9;v+=step)out.push(+v.toFixed(6));return out;}

/* ---- Interaction layer: crosshair, tooltip, keyboard, point tips ---- */
function attachChart(el,id){
  const svg=el.querySelector("svg.chart");if(!svg)return;
  const M=MODELS[id],xh=svg.querySelector(".crosshair"),VBW=svg.viewBox.baseVal.width;
  const tip=document.createElement("div");tip.className="chart-tip";tip.setAttribute("role","status");tip.setAttribute("aria-live","polite");el.appendChild(tip);
  const toSvg=e=>{const r=svg.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*VBW,y:(e.clientY-r.top)/r.height*svg.viewBox.baseVal.height};};
  /* SVG elements have no offsetLeft/clientWidth, so measure with bounding boxes (and undo page zoom) */
  function place(sx,sy){
    const er=el.getBoundingClientRect(),sr=svg.getBoundingClientRect(),z=er.width/el.offsetWidth||1;
    const k=sr.width/VBW/z,ox=(sr.left-er.left)/z,oy=(sr.top-er.top)/z;
    const left=ox+sx*k+16,tw=tip.offsetWidth;
    tip.style.top=Math.max(0,oy+sy*k-8)+"px";
    tip.style.left=(left+tw>el.offsetWidth-4?Math.max(0,ox+sx*k-16-tw):left)+"px";
  }
  let cur=null;
  function clearHot(){svg.querySelectorAll(".pt.hot").forEach(p=>p.classList.remove("hot"));}
  function showX(x){
    if(!M)return;cur=x;const px=M.X(x);
    if(xh){xh.setAttribute("x1",px);xh.setAttribute("x2",px);}svg.classList.add("hovering");
    clearHot();svg.querySelectorAll(`.pt[data-x="${x}"]`).forEach(p=>p.classList.add("hot"));
    const off=OFF[id]||new Set();
    const rows=M.series.filter(s=>!off.has(s.k)&&s.v[x]!==undefined).map(s=>`<div class="tip-row"><i style="background:${s.color}"></i><span>${s.name}</span><b>${s.v[x]}${M.unit?` <small>${M.unit}</small>`:""}</b>${M.status?M.status(s.v[x]):""}</div>`).join("");
    tip.innerHTML=`<div class="tip-h">${M.xlabel(x)}</div>${rows||'<div class="tip-row">All series are hidden</div>'}`;
    tip.classList.add("on");place(px,M.top);
  }
  function showTip(target){
    const bb=target.getBBox();svg.classList.remove("hovering");clearHot();
    if(target.classList.contains("pt"))target.classList.add("hot");
    tip.innerHTML=`<div class="tip-h">${target.dataset.tip}</div>`;tip.classList.add("on");place(bb.x+bb.width,bb.y);
  }
  function hide(){svg.classList.remove("hovering");tip.classList.remove("on");clearHot();cur=null;}
  svg.addEventListener("pointermove",e=>{
    const t=e.target.closest("[data-tip]");if(t){showTip(t);return;}
    if(!M){hide();return;}
    const p=toSvg(e);if(p.x<M.X(M.xs[0])-30||p.x>M.X(M.xs.at(-1))+30){hide();return;}
    let best=M.xs[0],bd=1e9;for(const x of M.xs){const d=Math.abs(M.X(x)-p.x);if(d<bd){bd=d;best=x;}}
    if(best!==cur)showX(best);
  });
  svg.addEventListener("pointerleave",hide);
  svg.addEventListener("blur",hide);
  svg.addEventListener("keydown",e=>{
    if(!M)return;const i=cur===null?-1:M.xs.indexOf(cur);let j=null;
    if(e.key==="ArrowRight")j=Math.min(M.xs.length-1,i+1);else if(e.key==="ArrowLeft")j=i<0?0:Math.max(0,i-1);
    else if(e.key==="Home")j=0;else if(e.key==="End")j=M.xs.length-1;else if(e.key==="Escape"&&cur!==null){e.stopPropagation();hide();return;}
    if(j!==null){e.preventDefault();showX(M.xs[j]);}
  });
}

/* ---- Mounting + entrance animation (plays once, the first time a chart scrolls into view) ---- */
const io=new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting)return;const el=en.target;io.unobserve(el);const id=el.dataset.mount||el.dataset.anim;PLAYED.add(id);el.classList.remove("await");void el.offsetWidth;el.classList.add("anim");}),{threshold:.2});
function mountCharts(){
  document.querySelectorAll("[data-mount]").forEach(el=>{
    const id=el.dataset.mount,w=Math.floor(el.clientWidth);if(!(w>0))return;
    io.unobserve(el);el.classList.add("cw");el.classList.remove("anim","soft","await");
    el.innerHTML=MOUNTS[id](w);el.dataset.off=[...(OFF[id]||[])].join(" ");
    attachChart(el,id);
    if(PLAYED.has(id)){void el.offsetWidth;el.classList.add("soft");}else{el.classList.add("await");io.observe(el);}
  });
  document.querySelectorAll("[data-anim]").forEach(el=>{io.unobserve(el);el.classList.remove("anim","await");if(!PLAYED.has(el.dataset.anim)){el.classList.add("await");io.observe(el);}});
}

function menuKeys(e,list,choose,close){
  const items=[...list.querySelectorAll("[role=menuitemradio]")],i=items.indexOf(document.activeElement);
  if(e.key==="ArrowDown"){e.preventDefault();items[(i+1)%items.length].focus();}
  else if(e.key==="ArrowUp"){e.preventDefault();items[(i-1+items.length)%items.length].focus();}
  else if(e.key==="Home"){e.preventDefault();items[0].focus();}
  else if(e.key==="End"){e.preventDefault();items.at(-1).focus();}
  else if(e.key==="Escape"){e.preventDefault();e.stopPropagation();close();}
  else if(e.key==="Tab"){close(false);}
  else if((e.key==="Enter"||e.key===" ")&&i>=0){e.preventDefault();choose(items[i]);}
}

      ${csLbl("Caption","csCaption")}<textarea id="csCaption" class="cs-in" data-f="caption" rows="3" placeholder="${d.hint}">${c.caption}</textarea>
      <div class="cs-stack">${csCheck("dots",c.dots,"Show sample dots")}${csCheck("table",c.table,"Show as table")}</div>`)}
    ${csSec("x","X-axis",`
      ${csLbl("X value")}
      ${csCheck("continuous",c.continuous,"Use continuous time")}
      ${csLbl("Label","csXLabel")}<input id="csXLabel" class="cs-in" data-f="xLabel" value="${c.xLabel}" placeholder="Hours"/>
      ${csLbl("Axis range")}${csPair("X axis range",["x0",c.x0],["x1",c.x1])}`)}
    ${csSec("y","Y-axis",`
      ${csLbl("Label","csYLabel")}<input id="csYLabel" class="cs-in" data-f="yLabel" value="${c.yLabel}" placeholder="${d.unit}"/>
      ${csLbl("Axis range")}${csPair("Y axis range",["ymin",c.ymin],["ymax",c.ymax],[d.y0,d.y1])}
      ${csLbl("Physiological limits")}${csPair("Physiological limits",["lo",c.lo],["hi",c.hi])}
      ${csLbl("Measurement limits")}${csPair("Measurement limits",["mlo",c.mlo],["mhi",c.mhi])}`)}
    ${csSec("ann","Annotations",`
      ${csLbl("Excluded points")}
      ${ex?`<div class="ex-list">${ex}</div>`:'<p class="cs-help">Click a point on the chart to exclude it.</p>'}
      ${csLbl("Chart legend")}
      ${csCheck("legend",S.kfLegend,"Show")}
      ${csLbl("Interventions","csInt",INFO.interventions)}<textarea id="csInt" class="cs-in" data-f="interventions" rows="2" placeholder="e.g. 1, 2, 0.5">${c.interventions}</textarea>
      ${csLbl("Dialysis","csDia",INFO.dialysis)}<textarea id="csDia" class="cs-in" data-f="dialysis" rows="2" placeholder="e.g. 1-2, 4-5.5">${c.dialysis}</textarea>
      ${csLbl("Deviations","csDev",INFO.deviations)}<textarea id="csDev" class="cs-in" data-f="deviations" rows="2" placeholder="e.g. 1, 2, 0.5">${c.deviations}</textarea>`)}
    <p class="side-hint">Click an empty part of the page, or press Esc, to go back to the block list.</p>
  </div>`;
}
function groupsPanel(){
  const a=ARM(),g=groupStats(),G=S.group;
  const chips=arm=>KIDS[arm].map(k=>`<button type="button" class="kid" aria-pressed="${!G.off.has(k)}" data-kid="${k}" aria-label="${k}, ${G.off.has(k)?"left out":"included"}">${k}</button>`).join("");
  return `<div class="side-settings">
    <div class="side-head"><div><div class="side-kicker">Groups</div><div class="side-title">Lactate group chart</div></div>
      <button class="icon-btn" data-deselect aria-label="Close group settings">${icon("x")}</button></div>
    <div class="grp"><b><i class="dot" style="background:var(--control)"></i>${a.c} · ${g.c.n} kidneys</b><div class="chipset">${chips("c")}</div></div>
    <div class="grp"><b><i class="dot" style="background:var(--treatment)"></i>${a.t} · ${g.t.n} kidneys</b><div class="chipset">${chips("t")}</div></div>
    <span class="side-hint" style="margin:0">Click a kidney to leave it out of its group.</span>
    <label class="toggle"><input type="checkbox" id="baseline" ${G.baseline?"checked":""}/>Change from 6-hr baseline</label>
    <label class="lbl" for="highlight">Highlight one kidney</label>
    <select id="highlight" class="side-select"><option value="">None</option>${[...KIDS.c,...KIDS.t].map(k=>`<option ${k===G.highlight?"selected":""}>${k}</option>`).join("")}</select>
    <p class="side-hint">Click an empty part of the page, or press Esc, to go back to the block list.</p>
  </div>`;
}
function selectBlock(id){
  if(side.selected===id)return;
  side.selected=id;
  document.querySelectorAll("[data-select]").forEach(el=>el.classList.toggle("selected",el.dataset.select===id));
  renderAside();
}
const libItem=([ic,t,s],isNew)=>`<button class="lib-item" draggable="true"><span class="lib-icon">${icon(ic)}</span><span><span class="lib-title">${t}${isNew?'<span class="new">New</span>':""}</span><span class="lib-sub">${s}</span></span></button>`;
function renderAside(){
  const b=document.getElementById("asideBody");
  if(KF[side.selected]){b.innerHTML=chartSettingsPanel(side.selected);return;}
  if(side.selected==="group"){b.innerHTML=groupsPanel();return;}
  const items=side.cat==="Basic"?`${BASIC.map(x=>libItem(x)).join("")}`
    :`<div class="empty-cat"><strong>${side.cat}</strong>Blocks in this category load from the study’s data.</div>`;
  const cur=CATS.find(c=>c.id===side.cat);
  b.innerHTML=`<div class="cats-wrap"><div class="relative" id="catMenu">
      <button id="catBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="catList" aria-label="Block category: ${cur.label}" class="${BTN_CLS} w-full">
        <span class="flex text-gray-600">${icon(cur.icon)}</span><span class="flex-1 text-left">${cur.label}</span>${CHEVRON("catChevron")}
      </button>
      <div id="catList" role="menu" aria-label="Choose a block category" hidden class="${LIST_CLS} left-0 right-0 max-h-[65vh] overflow-y-auto">${CATS.map(c=>menuItem(c,c.id===side.cat,"data-cat")).join("")}</div>
    </div></div><div class="blocks">${items}</div>`;
}
const aside=document.getElementById("asideBody");
aside.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.f&&KF[side.selected]){applyField(t,true);return;}
  if(t.id==="baseline"){S.group.baseline=t.checked;render();}
  else if(t.id==="highlight"){S.group.highlight=t.value;render();}
});
/* Apply one chart setting. Text fields update live as you type; others on change. */
function applyField(t,committed){
  const c=S.charts[side.selected],f=t.dataset.f;
  if(t.type==="checkbox"){
    if(f==="case-c"||f==="case-t"){const k=f.slice(5);if(!t.checked&&!c.cases[k==="c"?"t":"c"]){t.checked=true;toast("Keep at least one case on the chart");return;}c.cases[k]=t.checked;}
    else if(f==="legend")S.kfLegend=t.checked;
    else c[f]=t.checked;
    render();return;
  }
  if(f==="x0"||f==="x1"){if(!committed)return;const x0=+aside.querySelector('[data-f="x0"]').value,x1=+aside.querySelector('[data-f="x1"]').value;
    if(!(x0>=0&&x1<=72&&x1-x0>=6)){toast("Pick hours from 0 to 72, at least 6 hours apart");t.value=c[f];return;}c.x0=x0;c.x1=x1;render();return;}
  if(f==="metric"){c.metric=t.value;c.excluded=[];c.ymin=c.ymax=c.lo=c.hi="";
    const b=KF[t.value].band;if(b){c.lo=b[0];c.hi=b[1];}render();renderAside();return;}
  c[f]=t.value;render();
  if(f==="title"){const h=aside.querySelector(".side-title");if(h)h.textContent=chartView(side.selected).title;}
}
aside.addEventListener("input",e=>{const t=e.target;if(t.dataset.f&&KF[side.selected]&&t.type!=="checkbox"&&t.tagName!=="SELECT"&&!["x0","x1"].includes(t.dataset.f)){clearTimeout(t._h);t._h=setTimeout(()=>applyField(t,false),250);}});
aside.addEventListener("toggle",e=>{const d=e.target.closest?.("details[data-sec]");if(!d)return;d.open?side.closed.delete(d.dataset.sec):side.closed.add(d.dataset.sec);},true);
aside.addEventListener("click",e=>{
  if(e.target.closest("[data-deselect]")){selectBlock(null);return;}
  const w=e.target.closest("[data-width]");if(w&&KF[side.selected]){S.charts[side.selected].width=w.dataset.width;render();renderAside();aside.querySelector(`[data-width="${w.dataset.width}"]`)?.focus();return;}
  const un=e.target.closest("[data-unex]");if(un&&KF[side.selected]){const c=S.charts[side.selected];c.excluded=c.excluded.filter(x=>x!==un.dataset.unex);render();renderAside();return;}
  const kid=e.target.closest("[data-kid]");
  if(kid){const k=kid.dataset.kid;S.group.off.has(k)?S.group.off.delete(k):S.group.off.add(k);render();renderAside();document.querySelector(`#asideBody [data-kid="${k}"]`)?.focus();return;}
  const a=e.target.closest("[data-act]");if(a)toast({arrow:"Click the chart where the event happened",bracket:"Drag across the chart to mark a period"}[a.dataset.act]);
});
/* Select the chart by clicking it; click anywhere else on the page to go back */
document.getElementById("canvas").addEventListener("click",e=>{
  if(document.body.classList.contains("preview"))return;
  const sel=e.target.closest("[data-select]");
  const pt=e.target.closest(".pt,.pt-ex");
  if(sel&&pt&&side.selected===sel.dataset.select&&KF[side.selected]){
    const c=S.charts[side.selected],key=pt.closest("[data-k]").dataset.k+":"+pt.dataset.x;
    c.excluded=c.excluded.includes(key)?c.excluded.filter(x=>x!==key):[...c.excluded,key];
    render();renderAside();toast(c.excluded.includes(key)?"Point excluded. Click it again to put it back.":"Point put back");return;}
  if(sel)selectBlock(sel.dataset.select); else selectBlock(null);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&side.selected&&document.getElementById("viewList").hidden&&!document.getElementById("exportScrim").classList.contains("open"))selectBlock(null);});

/* ================= Interactions ================= */
const toast=m=>{const t=document.getElementById("toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",2400);};
const page=document.getElementById("page");
page.addEventListener("click",e=>{
  const t=e.target;
  const act=t.closest("[data-act]");
  if(act){const k=act.dataset.act;
    if(k==="table"){if(KF[act.dataset.chart])S.charts[act.dataset.chart].table=!S.charts[act.dataset.chart].table;else S.group.table=!S.group.table;render();if(side.selected)renderAside();return;}
    toast({slide:"Figure added to the slide deck with its title, legend and notes",download:"Figure downloaded as PNG",observe:"New observation added — type it in the box",arrow:"Click the chart where the event happened",bracket:"Drag across the chart to mark a period"}[k]);return;}
  const kid=t.closest("[data-kid]");if(kid){const k=kid.dataset.kid;S.group.off.has(k)?S.group.off.delete(k):S.group.off.add(k);render();return;}
  const g=t.closest("[data-gross]");if(g){openGross(g.dataset.gross);return;}
  const h=t.closest("[data-hour]");if(h){S.photoHour=+h.dataset.hour;render();return;}
  if(t.closest("[data-gmode]")){S.grossNoteMode=!S.grossNoteMode;render();document.querySelector("[data-gmode]")?.focus();return;}
  const gdel=t.closest("[data-gdel]");if(gdel){const id=`${S.grossArm}-${S.grossHour}`,k=+gdel.dataset.gdel;S.grossNotes[id].splice(k,1);render();toast(`Note ${k+1} deleted`);return;}
  const gpin=t.closest("[data-gpin]");if(gpin){document.querySelector(`[data-gnote="${gpin.dataset.gpin}"]`)?.focus();return;}
  const stg=t.closest("[data-gstage]");
  if(stg&&!t.closest(".zoombox")){
    if(!S.grossNoteMode){openGross(stg.dataset.gstage);return;}
    const r=stg.querySelector(".gross-canvas").getBoundingClientRect();
    const x=Math.min(98,Math.max(2,(e.clientX-r.left)/r.width*100)),y=Math.min(98,Math.max(2,(e.clientY-r.top)/r.height*100));
    const list=S.grossNotes[stg.dataset.gstage]||(S.grossNotes[stg.dataset.gstage]=[]);list.push({x:+x.toFixed(1),y:+y.toFixed(1),text:""});
    S.grossNoteMode=false;render();document.querySelector(`[data-gnote="${list.length-1}"]`)?.focus();return;}
  const gs=t.closest("[data-gslide]");if(gs){S.grossHour=+gs.dataset.gslide;render();return;}
  const ga=t.closest("[data-garm]");if(ga){S.grossArm=ga.dataset.garm;render();return;}
  const gz=t.closest("[data-gz]");if(gz){S.grossZoom=Math.min(2.5,Math.max(1,S.grossZoom+(+gz.dataset.gz)*0.25));render();return;}
  const sl=t.closest("[data-slide]");if(sl){S.slideHour=+sl.dataset.slide;render();return;}
  const ar=t.closest("[data-arm]");if(ar){S.slideArm=ar.dataset.arm;render();return;}
  const z=t.closest("[data-z]");if(z){S.slideZoom=Math.min(2.5,Math.max(1,S.slideZoom+(+z.dataset.z)*0.25));render();return;}
  if(t.id==="showOrig"){e.preventDefault();S.removeBg=false;S.rotate=0;render();return;}
  const fill=t.closest("[data-fill]");if(fill){e.preventDefault();toast(`Opening the donor record to add “${fill.dataset.fill}”`);return;}
  const j=t.closest("[data-jump]");if(j){e.preventDefault();document.getElementById(j.dataset.jump).scrollIntoView({behavior:"smooth",block:"center"});return;}
  if(t.closest("a[href='#']"))e.preventDefault();
});
page.addEventListener("change",e=>{
  const t=e.target;
  if(false){}
  else if(t.id==="removeBg"){S.removeBg=t.checked;render();}
  else if(t.id==="baseline"){S.group.baseline=t.checked;render();}
  else if(t.id==="highlight"){S.group.highlight=t.value;render();}
});
page.addEventListener("input",e=>{
  const gn=e.target.closest?.("[data-gnote]");if(gn){const id=`${S.grossArm}-${S.grossHour}`,k=+gn.dataset.gnote,n=S.grossNotes[id][k];n.text=gn.value;const p=document.querySelector(`[data-gpin="${k}"]`);if(p){p.title=n.text||"Empty note";p.setAttribute("aria-label",`Note ${k+1}${n.text?": "+n.text:""}`);}return;}if(e.target.id==="rotate"){S.rotate=+e.target.value;document.getElementById("rotVal").textContent=S.rotate+"°";document.querySelectorAll("button.tile .organ").forEach(o=>{const idx=+o.parentElement.dataset.hour;o.style.transform=`rotate(${S.rotate+(idx*17%23)-11}deg)`;});}});

document.querySelectorAll("#modeSeg button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("#modeSeg button").forEach(x=>x.setAttribute("aria-checked",x===b));if(b.dataset.mode==="preview")selectBlock(null);document.body.classList.toggle("preview",b.dataset.mode==="preview");mountCharts();}));
/* ---- View menu (menu button with radio items) ---- */
const VIEWS=[
  {id:"full",label:"Full data",desc:"See every chart, table and internal note.",icon:"eye"},
  {id:"summary",label:"Customer summary",desc:"Hide notes, settings and builders for partners.",icon:"presentation"},
  {id:"blinded",label:"Blinded",desc:"Hide arm names so operators stay blinded.",icon:"eye-off"}
];
const vBtn=document.getElementById("viewBtn"),vList=document.getElementById("viewList");
function renderViewMenu(){
  const cur=VIEWS.find(v=>v.id===S.view);
  document.getElementById("viewBtnIcon").innerHTML=icon(cur.icon);
  document.getElementById("viewBtnLabel").textContent=cur.label;
  vList.innerHTML=VIEWS.map(v=>menuItem(v,v.id===S.view,"data-view")).join("");
}
function openViewMenu(focusIdx){
  closeCatMenu(false);vList.hidden=false;vBtn.setAttribute("aria-expanded","true");document.getElementById("viewChevron").style.transform="rotate(180deg)";
  const items=[...vList.querySelectorAll("[role=menuitemradio]")];
  (items[focusIdx??VIEWS.findIndex(v=>v.id===S.view)]||items[0]).focus();
}
function closeViewMenu(refocus=true){
  vList.hidden=true;vBtn.setAttribute("aria-expanded","false");document.getElementById("viewChevron").style.transform="";
  if(refocus)vBtn.focus();
}
function setView(id){
  S.view=id;document.body.classList.toggle("summary",id==="summary");document.body.classList.toggle("blinded",id==="blinded");
  renderViewMenu();render();
  if(id==="blinded")toast("Blinded view: arm names hidden for perfusion operators");
  if(id==="summary")toast("Customer summary: notes, settings and builders hidden");
}
vBtn.addEventListener("click",()=>vList.hidden?openViewMenu():closeViewMenu());
vBtn.addEventListener("keydown",e=>{if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();openViewMenu();}});
vList.addEventListener("click",e=>{const it=e.target.closest("[data-view]");if(it){setView(it.dataset.view);closeViewMenu();}});
vList.addEventListener("keydown",e=>menuKeys(e,vList,it=>{setView(it.dataset.view);closeViewMenu();},closeViewMenu));

document.addEventListener("click",e=>{if(!vList.hidden&&!e.target.closest("#viewMenu"))closeViewMenu(false);});
renderViewMenu();
/* ---- Block category menu (same pattern as the View menu) ---- */
const catEls=()=>[document.getElementById("catBtn"),document.getElementById("catList")];
function openCatMenu(){const [btn,list]=catEls();if(!btn)return;closeViewMenu(false);list.hidden=false;btn.setAttribute("aria-expanded","true");document.getElementById("catChevron").style.transform="rotate(180deg)";
  const items=[...list.querySelectorAll("[role=menuitemradio]")];(items[CATEGORIES.indexOf(side.cat)]||items[0]).focus();}
function closeCatMenu(refocus=true){const [btn,list]=catEls();if(!btn||list.hidden)return;list.hidden=true;btn.setAttribute("aria-expanded","false");document.getElementById("catChevron").style.transform="";if(refocus)btn.focus();}
function setCat(id){side.cat=id;renderAside();document.getElementById("catBtn").focus();}
aside.addEventListener("click",e=>{
  if(e.target.closest("#catBtn")){const [,list]=catEls();list.hidden?openCatMenu():closeCatMenu();return;}
  const it=e.target.closest("[data-cat]");if(it)setCat(it.dataset.cat);
});
aside.addEventListener("keydown",e=>{
  if(e.target.id==="catBtn"&&(e.key==="ArrowDown"||e.key==="ArrowUp")){e.preventDefault();openCatMenu();return;}
  const [,list]=catEls();if(list&&!list.hidden&&list.contains(e.target))menuKeys(e,list,it=>setCat(it.dataset.cat),closeCatMenu);
});
document.addEventListener("click",e=>{if(!e.target.closest("#catMenu"))closeCatMenu(false);});

document.body.insertAdjacentHTML("beforeend",`<dialog id="grossDlg" class="gross-dlg" aria-labelledby="gdTitle"><div class="gd-head"><strong class="gd-title" id="gdTitle"></strong><button type="button" class="icon-btn" data-gd="close" aria-label="Close">${icon("x")}</button></div><div class="gd-body"><button type="button" class="gd-nav" data-gd="-1" aria-label="Previous photo">${icon("arrow-left")}</button><img alt=""/><button type="button" class="gd-nav" data-gd="1" aria-label="Next photo">${icon("arrow-right")}</button></div></dialog>`);
(()=>{const d=document.getElementById("grossDlg"),order=["c","t"].flatMap(a=>GROSS.hours.map((_,i)=>`${a}-${i}`));
  const step=n=>{const k=order.indexOf(d.dataset.id);openGross(order[(k+n+order.length)%order.length]);};
  d.addEventListener("click",e=>{const b=e.target.closest("[data-gd]");if(e.target===d||b?.dataset.gd==="close"){d.close();return;}if(b)step(+b.dataset.gd);});
  d.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){e.preventDefault();step(1);}if(e.key==="ArrowLeft"){e.preventDefault();step(-1);}});
  d.addEventListener("close",()=>setTimeout(()=>document.querySelector(`[data-gross="${d.dataset.id}"]`)?.focus()));})();
/* Link a note in the list with its pin on the photo */
const gHot=(k,on)=>{document.querySelectorAll(`[data-gpin="${k}"],[data-gnote-row="${k}"]`).forEach(x=>x.classList.toggle("hot",on));};
page.addEventListener("pointerover",e=>{const el=e.target.closest?.("[data-gpin],[data-gnote-row]");if(el)gHot(el.dataset.gpin??el.dataset.gnoteRow,true);});
page.addEventListener("pointerout",e=>{const el=e.target.closest?.("[data-gpin],[data-gnote-row]");if(el)gHot(el.dataset.gpin??el.dataset.gnoteRow,false);});
page.addEventListener("focusin",e=>{const el=e.target.closest?.("[data-gnote]");if(el)gHot(el.dataset.gnote,true);});
page.addEventListener("focusout",e=>{const el=e.target.closest?.("[data-gnote]");if(el)gHot(el.dataset.gnote,false);});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.grossNoteMode){S.grossNoteMode=false;render();}});
const scrim=document.getElementById("exportScrim");
document.getElementById("openExport").onclick=()=>{scrim.classList.add("open");scrim.querySelector(".fmt[aria-checked=true]").focus();};
const closeExport=()=>{scrim.classList.remove("open");document.getElementById("openExport").focus();};
document.getElementById("cancelExport").onclick=closeExport;
scrim.addEventListener("click",e=>{if(e.target===scrim)closeExport();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&scrim.classList.contains("open"))closeExport();});
document.querySelectorAll(".fmt").forEach(f=>f.onclick=()=>document.querySelectorAll(".fmt").forEach(x=>x.setAttribute("aria-checked",x===f)));
document.getElementById("doExport").onclick=()=>{const f=document.querySelector(".fmt[aria-checked=true]").dataset.f;closeExport();toast(`Exported as ${f} (demo — no file was created)`);};

/* Zoom never goes below 100%, so on-screen text never drops under 14px */

let st;document.addEventListener("input",()=>{const s=document.getElementById("saved");s.textContent="Saving…";clearTimeout(st);st=setTimeout(()=>s.textContent="Autosaved",700);});

hydrate();renderAside();render();
if(document.fonts)document.fonts.ready.then(mountCharts);
setTimeout(()=>document.body.classList.add("booted"),900);
</script>
</body>
</html>
